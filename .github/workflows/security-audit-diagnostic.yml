name: Temporary dependency remediation and validation

on:
  push:
    branches:
      - security/production-hardening

permissions:
  contents: write

jobs:
  validate-and-refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/production-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile using declared security overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: TypeScript checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Report remaining advisories
        shell: bash
        run: |
          npm audit --json > /tmp/audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          console.log('AUDIT_SUMMARY', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log('AUDIT_ITEM', JSON.stringify({
              name, severity: item.severity, isDirect: item.isDirect,
              range: item.range, fixAvailable: item.fixAvailable,
              via: (item.via ?? []).map(v => typeof v === 'string' ? v : ({ title: v.title, url: v.url, range: v.range })),
              effects: item.effects,
            }));
          }
          NODE
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh dependency lockfile with audited overrides"
          git push origin HEAD:security/production-hardening
