name: Temporary security audit diagnostic

on:
  push:
    branches:
      - security/production-hardening

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Report all advisories without exposing environment values
        shell: bash
        run: |
          npm audit --json > /tmp/audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          console.log('AUDIT_SUMMARY', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log('AUDIT_ITEM', JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: (item.via ?? []).map(v => typeof v === 'string' ? v : ({ title: v.title, url: v.url, range: v.range })),
              effects: item.effects,
            }));
          }
          NODE
