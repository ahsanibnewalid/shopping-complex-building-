name: Temporary dependency remediation

on:
  push:
    branches:
      - feat/production-hardening-ci

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-hardening-ci
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install current locked dependencies
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund --fetch-retries=5 --fetch-timeout=120000

      - name: Apply non-breaking dependency security fixes
        run: |
          set +e
          npm audit fix --registry=https://registry.npmjs.org --no-fund --no-audit
          status=$?
          set -e
          # npm exits 1 when it applied safe fixes but advisories remain that
          # require separate review; retain the manifest changes for CI validation.
          if [[ "$status" -gt 1 ]]; then exit "$status"; fi

      - name: Commit updated dependency manifests when changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "npm audit fix made no manifest changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: remediate npm dependency vulnerabilities"
          git push origin HEAD:feat/production-hardening-ci
