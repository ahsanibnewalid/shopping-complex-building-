name: Restore missing BazarHub baseline files

on:
  push:
    branches:
      - main
    paths:
      - "Kimi_Agent_Complete Shopping Complex SaaS(1).zip"
      - "scripts/restore-missing-baseline.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-bazarhub-baseline
  cancel-in-progress: false

jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore missing files without overwriting existing files
        run: |
          if [[ -f "Kimi_Agent_Complete Shopping Complex SaaS(1).zip" ]]; then
            node scripts/restore-missing-baseline.mjs "Kimi_Agent_Complete Shopping Complex SaaS(1).zip"
          else
            echo "The one-time archive has already been consumed; checking restored source tree."
            test -f src/App.tsx
            test -f src/main.tsx
            test -f api/router.ts
          fi
      - name: Commit restored files and remove temporary archive
        run: |
          rm -f "Kimi_Agent_Complete Shopping Complex SaaS(1).zip"
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Restore missing BazarHub baseline files"
            git push origin HEAD:main
          else
            echo "No changes to restore."
          fi
