<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">BazarHub multi-tenant shopping marketplace concept</title>
<desc id="desc">Illustrative product preview showing a central marketplace, merchant storefront cards, and an operations dashboard. This is a concept illustration, not a live application screenshot.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102c45"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25d6b3"/><stop offset="1" stop-color="#36a6ff"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9c8cff"/><stop offset="1" stop-color="#5c7cff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020914" flood-opacity=".35"/></filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#9ec8df" opacity=".2"/></pattern>
</defs>
<rect width="1440" height="760" rx="30" fill="url(#bg)"/><rect width="1440" height="760" rx="30" fill="url(#dots)"/>
<circle cx="1210" cy="110" r="250" fill="#2476a5" opacity=".12"/><circle cx="220" cy="690" r="280" fill="#24c9a5" opacity=".08"/>
