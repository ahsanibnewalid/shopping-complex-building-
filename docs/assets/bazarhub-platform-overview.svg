      <rect x="342" y="553" width="228" height="112" rx="13" fill="#f1edff"/><rect x="355" y="566" width="66" height="63" rx="9" fill="#d9d0ff"/>
      <path d="M369 612v-28l17-11 17 11v28z" fill="#8877dd"/><rect x="381" y="594" width="10" height="18" fill="#f1edff"/>
