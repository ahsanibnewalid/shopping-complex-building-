    <rect x="944" y="575" width="388" height="88" rx="12" fill="#1b3650"/><text x="962" y="600" fill="#a8c0d3" font-size="11">TEAM &amp; ACCESS</text><text x="962" y="625" fill="#f4f8fc" font-size="15" font-weight="700">Owner · Manager · Staff</text><text x="962" y="646" fill="#a8c0d3" font-size="11">Role-based workspace concept</text>
