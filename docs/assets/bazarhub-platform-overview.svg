  <text x="76" y="145" fill="#f4f8fc" font-size="43" font-weight="750">One destination.</text>
  <text x="76" y="195" fill="#f4f8fc" font-size="43" font-weight="750">Every shop has a storefront.</text>
  <text x="78" y="232" fill="#b7c9d8" font-size="18">A digital shopping complex with a shared marketplace</text>
  <text x="78" y="260" fill="#b7c9d8" font-size="18">and independent merchant experiences.</text>
  <g filter="url(#shadow)">
    <rect x="76" y="304" width="800" height="390" rx="20" fill="#f8fbff"/>
    <path d="M96 304h760a20 20 0 0 1 20 20v35H76v-35a20 20 0 0 1 20-20z" fill="#e8eff6"/>
    <circle cx="100" cy="330" r="5" fill="#ff7777"/><circle cx="118" cy="330" r="5" fill="#f5c45f"/><circle cx="136" cy="330" r="5" fill="#53d6a4"/>
    <rect x="170" y="319" width="470" height="22" rx="11" fill="#d3dee9"/>
    <rect x="100" y="378" width="180" height="28" rx="8" fill="#e8f8f4"/><text x="115" y="397" fill="#147e70" font-size="13" font-weight="700">Discover the complex</text>
    <text x="100" y="450" fill="#12283e" font-size="25" font-weight="750">Find your next favourite</text>
    <text x="100" y="474" fill="#667b8e" font-size="13">Explore stores, products and local brands</text>
    <rect x="100" y="495" width="450" height="39" rx="10" fill="#fff" stroke="#d8e2ec"/><text x="118" y="519" fill="#8a9bad" font-size="13">Search products, shops, brands…</text>
    <rect x="560" y="495" width="88" height="39" rx="10" fill="url(#accent)"/><text x="580" y="519" fill="#06243a" font-size="13" font-weight="700">Search</text>
