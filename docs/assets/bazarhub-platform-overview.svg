      <rect x="584" y="553" width="264" height="112" rx="13" fill="#fff2e5"/><rect x="597" y="566" width="66" height="63" rx="9" fill="#ffd9b1"/>
      <path d="M612 609l17-33 17 33z" fill="#d98b4b"/><circle cx="629" cy="590" r="6" fill="#fff1e3"/>
      <text x="674" y="581" fill="#173248" font-size="13" font-weight="700">Everyday Market</text><text x="674" y="601" fill="#64788a" font-size="11">Fashion &amp; essentials</text><text x="674" y="620" fill="#ba6b2c" font-size="11" font-weight="700">View storefront →</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="912" y="285" width="452" height="408" rx="22" fill="#12263c" stroke="#36516b"/>
    <text x="944" y="329" fill="#f4f8fc" font-size="20" font-weight="700">Merchant workspace</text>
    <text x="944" y="352" fill="#9eb4c7" font-size="12">Illustrative tenant dashboard</text>
    <rect x="944" y="375" width="388" height="72" rx="12" fill="#1b3650"/>
    <rect x="960" y="391" width="40" height="40" rx="10" fill="url(#accent)"/><path d="M971 411h18m-9-9v18" stroke="#073148" stroke-width="3" stroke-linecap="round"/>
    <text x="1015" y="402" fill="#a8c0d3" font-size="11">Store status</text><text x="1015" y="423" fill="#f4f8fc" font-size="17" font-weight="700">Your brand, your shop</text>
