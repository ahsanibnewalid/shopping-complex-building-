      <rect x="100" y="553" width="228" height="112" rx="13" fill="#e6f5f1"/><rect x="113" y="566" width="66" height="63" rx="9" fill="#b7e9dc"/>
      <path d="M129 606l15-22 19 22z" fill="#2b9d8a"/><circle cx="145" cy="584" r="7" fill="#fff" opacity=".8"/>
