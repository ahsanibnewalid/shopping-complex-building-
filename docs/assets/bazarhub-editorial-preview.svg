<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="t d"><title id="t">BazarHub marketplace visual</title><desc id="d">Editorial black and white concept of the actual homepage layout, featuring large typography, search, and a shop directory.</desc><rect width="1400" height="680" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#111"><rect x="1" y="1" width="1398" height="678" fill="none" stroke="#111" stroke-width="2"/><text x="58" y="62" font-size="28" font-weight="900" letter-spacing="-1">BAZARHUB.</text><text x="1014" y="59" font-size="13" letter-spacing="2">DIRECTORY   PRODUCTS   SELL</text><path d="M0 88H1400" stroke="#111" stroke-width="2"/><text x="58" y="146" font-size="15" letter-spacing="2">A VERTICAL MARKET — SHOPS UNDER ONE ROOF</text><text x="55" y="239" font-size="72" font-weight="900" letter-spacing="-4">Every shop in the building,</text><text x="55" y="316" font-size="76" font-weight="900" letter-spacing="-4">one address.</text><text x="58" y="361" font-family="Georgia,serif" font-size="20" fill="#555">Browse the directory, walk into a storefront, buy the thing or book the service.</text><rect x="58" y="394" width="790" height="55" fill="#fff" stroke="#111" stroke-width="2"/><text x="78" y="429" font-size="17" fill="#999">Search the whole complex — products, services, shops…</text><rect x="848" y="394" width="150" height="55" fill="#111"/><text x="887" y="429" font-size="17" fill="#fff">Search</text><path d="M0 484H1400" stroke="#111" stroke-width="2"/><text x="58" y="540" font-size="38" font-weight="900" letter-spacing="-2">The Directory</text><rect x="1085" y="510" width="75" height="35" fill="#111"/><text x="1109" y="533" font-size="13" fill="#fff">ALL</text><rect x="1170" y="510" width="175" height="35" fill="none" stroke="#111"/><text x="1185" y="533" font-size="13">SHOP / AGENCY</text><g font-size="17" font-weight="700"><rect x="58" y="568" width="410" height="80" fill="#f4f4f2" stroke="#111"/><rect x="492" y="568" width="410" height="80" fill="#f4f4f2" stroke="#111"/><rect x="926" y="568" width="419" height="80" fill="#f4f4f2" stroke="#111"/><text x="78" y="610">01 / MERCHANT STOREFRONTS</text><text x="512" y="610">02 / PRODUCTS &amp; SERVICES</text><text x="946" y="610">03 / BUSINESS WORKSPACES</text></g></g></svg>